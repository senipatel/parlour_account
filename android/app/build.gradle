plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseStorePath = System.getenv("PARLOUR_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("PARLOUR_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("PARLOUR_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("PARLOUR_RELEASE_KEY_PASSWORD")
def releaseSigningValues = [
    releaseStorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def hasReleaseSigning = releaseSigningValues.every { value ->
    value != null && !value.trim().isEmpty()
}
def hasPartialReleaseSigning = releaseSigningValues.any { value ->
    value != null && !value.trim().isEmpty()
}
if (hasPartialReleaseSigning && !hasReleaseSigning) {
    throw new GradleException("Set all four PARLOUR_RELEASE_* signing variables or leave them all unset.")
}

android {
    namespace = "com.example.parlour_account"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Specify your unique application ID
        applicationId = "com.example.parlour_account"

        // Use the Flutter-specific versions
        minSdkVersion flutter.minSdkVersion   // Set this to 23 as per Firebase requirement
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
